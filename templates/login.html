{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card">
      <form class="card-body" method="post">
        <div class="auth-icon"><i class="bi bi-box-seam-fill" aria-hidden="true"></i></div>
        <h1 class="h4 text-center mb-1">Welcome back</h1>
        <p class="text-center text-muted small mb-4">Log in to manage your parcels.</p>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="role">I am a</label>
          <select class="form-select" id="role" name="role">
            <option value="customer" data-hint="Username">Customer</option>
            <option value="rider" data-hint="Username">Rider</option>
            <option value="admin" data-hint="Username">Admin</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="identifier" id="identifier-label">Username</label>
          <input class="form-control" id="identifier" name="identifier" autocapitalize="none" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <button class="btn btn-brand w-100 py-2">Log in</button>
        <p class="text-center small mt-3 mb-0">New customer? <a href="{{ url_for('register') }}">Create an account</a></p>
      </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
  const role = document.getElementById('role');
  const showHint = () => document.getElementById('identifier-label').textContent = role.selectedOptions[0].dataset.hint;
  role.addEventListener('change', showHint);
  showHint();
</script>
{% endblock %}
