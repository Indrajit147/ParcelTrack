{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card my-md-3">
      <form class="card-body p-4 p-md-5" method="post">
        <div class="auth-icon"><i class="bi bi-person-plus-fill" aria-hidden="true"></i></div>
        <h1 class="h4 text-center mb-1">Create a customer account</h1>
        <p class="text-center text-muted small mb-4">Book and track parcels from any branch.</p>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="full_name">Full name</label>
          <input class="form-control" id="full_name" name="full_name" maxlength="100" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" maxlength="30" pattern="[A-Za-z0-9_]{2,30}" title="2-30 letters, digits or _"
                 autocapitalize="none" required>
          <div class="form-text">You log in with this. Lowercase letters, digits or _.</div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" maxlength="120" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control" id="phone" name="phone" maxlength="15" placeholder="01XXXXXXXXX" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="address">Address</label>
          <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" minlength="6" required>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <button class="btn btn-brand w-100 py-2">Register</button>
        <p class="text-center small mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
