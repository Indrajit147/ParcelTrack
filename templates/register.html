{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header fw-semibold">Create a customer account</div>
      <form class="card-body" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="full_name">Full name</label>
          <input class="form-control" id="full_name" name="full_name" maxlength="100" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" maxlength="120" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-control" id="phone" name="phone" maxlength="15" placeholder="01XXXXXXXXX" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="address">Address</label>
          <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" minlength="6" required>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <button class="btn btn-brand w-100">Register</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
